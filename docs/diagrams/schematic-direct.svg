<text x="430" y="548" fill="#6AA6C9" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">nGATE  80 ms ramp + LM393 OC</text>
<rect x="280" y="390" width="280" height="210" rx="8" fill="#1C1E22" stroke="#E8A317" stroke-width="1.5"/>
<text x="420" y="418" fill="#E8A317" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">OVLO  ·  U1 LM393</text>
<text x="420" y="442" fill="#E8EAED" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">IN+  TL431  2.495 V</text>
<text x="420" y="462" fill="#E8EAED" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">IN−  VIN × 10k / 225k</text>
<text x="420" y="486" fill="#E8A317" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">trip  2.495 × 22.5 = 56.14 V</text>
<text x="420" y="510" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">OC → Q1 gate  (wins over GPIO)</text>
<text x="420" y="532" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">firmware latch 56.0 / clear 54.0</text>
<text x="420" y="556" fill="#8B9098" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">serial  ov reset</text>
<text x="420" y="580" fill="#C45C4A" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">Do not clamp Tesla rail with 54 V TVS</text>
<text x="560" y="200" fill="#8B9098" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="start">R1/R2 100k/10k → GPIO4 + 3.3 V zener</text>
<text x="24" y="690" fill="#E8A317" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">NTC on VIN (harness) stops buck inrush into Tesla digital fuses. 80 ms FET ramp stops Mini input-cap dump. Do not skip either.</text>
<text x="24" y="710" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Low-side switch: barrel sleeve is opened. Do not low-side the WPC ground. LIN TX stays off.</text>
</svg>
