<text x="120" y="548" fill="#E8A317" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">Q1 FQP13N10L</text>
<text x="120" y="568" fill="#8B9098" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">N-FET 100 V  low-side</text>
<text x="120" y="586" fill="#8B9098" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">D ← sleeve   S → GND</text>
<line x1="120" y1="600" x2="120" y2="640" stroke="#C5C8CE" stroke-width="2"/>
<text x="130" y="636" fill="#8B9098" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="start">GND</text>
