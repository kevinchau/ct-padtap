<text x="99" y="424" fill="#8B9098" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">center +  = VIN</text>
<text x="99" y="442" fill="#8B9098" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">sleeve     = switched</text>
<line x1="99" y1="460" x2="99" y2="520" stroke="#C5C8CE" stroke-width="2"/>
