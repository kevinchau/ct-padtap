<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Y-harness">
<rect width="720" height="360" fill="#0B0C0E"/>
<text x="20" y="28" fill="#E8A317" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="start">Y-HARNESS  ·  C X0648 12-WAY  ·  TAP PINS 1 / 9 / 4</text>
<rect x="20" y="60" width="200" height="160" rx="8" fill="#141518" stroke="#2A2D32" stroke-width="1.5"/>
<text x="120" y="100" fill="#C5C8CE" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">VEHICLE</text>
<text x="120" y="122" fill="#C5C8CE" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">HARNESS</text>
<text x="120" y="150" fill="#E8A317" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">pin 1  YE/BU</text>
<text x="120" y="170" fill="#E8A317" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">pin 9  BN/BU</text>
<line x1="220" y1="140" x2="280" y2="140" stroke="#E8A317" stroke-width="2"/>
<rect x="280" y="70" width="170" height="140" rx="8" fill="#1C1E22" stroke="#E8A317" stroke-width="1.5"/>
<text x="365" y="108" fill="#E8A317" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">Y FEMALE</text>
<text x="365" y="132" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">to vehicle plug</text>
<text x="365" y="168" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">all 12 pins 1:1</text>
<line x1="450" y1="110" x2="510" y2="110" stroke="#C5C8CE" stroke-width="2"/>
<path d="M365 210 V250 H510" fill="none" stroke="#E8A317" stroke-width="2"/>
<rect x="510" y="50" width="190" height="120" rx="8" fill="#141518" stroke="#2A2D32" stroke-width="1.5"/>
<text x="605" y="90" fill="#C5C8CE" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">Y MALE</text>
<text x="605" y="112" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">→ WPC 1877045</text>
<text x="605" y="134" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">Qi + NFC + CAN</text>
<rect x="510" y="210" width="190" height="130" rx="8" fill="#141518" stroke="#E8A317" stroke-width="1.5"/>
<text x="605" y="248" fill="#E8A317" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">PADTAP TAP</text>
<text x="605" y="272" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">1  YE/BU  48 V HSD</text>
<text x="605" y="292" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">9  BN/BU  GND</text>
<text x="605" y="312" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">4  GY  LIN listen</text>
<text x="20" y="250" fill="#C45C4A" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Never break pin 10 (LIN to HVAC switchpack) or 11/12 (key-card CAN).</text>
<text x="20" y="272" fill="#8B9098" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Pin 3 is USB GND pass-through — not PadTap return.</text>
<text x="20" y="294" fill="#8B9098" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">HSD X0034-91 is shared with USB. NTC + 80 ms ramp. Strain-relief.</text>
</svg>
