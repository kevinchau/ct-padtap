<text x="615" y="268" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">1  RD/BU  8240-0213  → VIN  + NTC + 58 V MINI 3 A</text>
<text x="615" y="290" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">9  BN/BU  8240-0213  → GND</text>
<text x="615" y="312" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">4  GN     8240-0215  → TLIN2029 RX only</text>
<text x="20" y="250" fill="#8B9098" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">1:1 on 1, 3, 4, 9, 10, 11, 12. Empty 2, 5–8.</text>
<text x="20" y="274" fill="#C45C4A" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Never break 10 (LIN to HVAC) or 11/12 (key-card CAN).</text>
<text x="20" y="298" fill="#8B9098" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Pin 3 WH/BU is USB GND thru — not PadTap return. 16 AWG will not crimp in 0213.</text>
