<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Y-harness">
<rect width="720" height="360" fill="#0B0C0E"/>
<text x="20" y="28" fill="#E8A317" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="start">Y-HARNESS  ·  1:1 PASS-THROUGH  ·  TAP 48V / GND / LIN</text>
<rect x="20" y="60" width="200" height="160" rx="8" fill="#141518" stroke="#2A2D32" stroke-width="1.5"/>
<text x="120" y="100" fill="#C5C8CE" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">VEHICLE</text>
<text x="120" y="122" fill="#C5C8CE" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">HARNESS</text>
<text x="120" y="150" fill="#E8A317" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">48V+  GND</text>
<text x="120" y="170" fill="#E8A317" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">LIN   P4</text>
<line x1="220" y1="140" x2="280" y2="140" stroke="#E8A317" stroke-width="2"/>
<rect x="280" y="70" width="170" height="140" rx="8" fill="#1C1E22" stroke="#E8A317" stroke-width="1.5"/>
<text x="365" y="108" fill="#E8A317" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">Y FEMALE</text>
<text x="365" y="132" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">to vehicle plug</text>
<text x="365" y="168" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">all 4 pins 1:1</text>
<line x1="450" y1="110" x2="510" y2="110" stroke="#C5C8CE" stroke-width="2"/>
<path d="M365 210 V250 H510" fill="none" stroke="#E8A317" stroke-width="2"/>
<rect x="510" y="50" width="190" height="120" rx="8" fill="#141518" stroke="#2A2D32" stroke-width="1.5"/>
<text x="605" y="90" fill="#C5C8CE" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">Y MALE</text>
<text x="605" y="112" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">→ WPC 1877045</text>
<text x="605" y="134" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">Qi + key-card NFC</text>
<rect x="510" y="210" width="190" height="130" rx="8" fill="#141518" stroke="#E8A317" stroke-width="1.5"/>
<text x="605" y="248" fill="#E8A317" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="middle">PADTAP TAP</text>
<text x="605" y="272" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">16 AWG  48V+ / GND</text>
<text x="605" y="292" fill="#E8EAED" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">22 AWG  LIN listen</text>
<text x="605" y="312" fill="#8B9098" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">P4 not tapped</text>
<text x="20" y="250" fill="#C45C4A" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Do not unplug the pad. Dead NFC, Service Mode fault.</text>
<text x="20" y="272" fill="#8B9098" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">LIN is high-Z listen. No extra pull-up. No TX.</text>
<text x="20" y="294" fill="#8B9098" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Adhesive shrink, then cloth tape. Strain-relief for seat travel.</text>
</svg>
